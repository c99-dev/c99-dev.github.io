name: 검증 및 OCI 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REACT_APP_GA_TRACKING_ID: ${{ vars.REACT_APP_GA_TRACKING_ID }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm test
      - run: npm run test:data
      - run: npm run validate-data
      - run: npm run build:production
      - name: 검증된 정적 파일을 OCI에 배포
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.OCI_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.OCI_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/aram-deploy-key"
          known_hosts="$RUNNER_TEMP/aram-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          tar -czf "$RUNNER_TEMP/aram-site.tar.gz" -C build .
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 \
            "aram-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/aram-site.tar.gz"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://aram.c99-dev.com/deployment.json | python -c \
            'import json,os,sys; assert json.load(sys.stdin)["commit"] == os.environ["GITHUB_SHA"], "운영 커밋이 다릅니다."'
