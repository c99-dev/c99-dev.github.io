# 최초 인증서 발급 전 HTTP와 내부 배포 확인용으로 사용합니다.
server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8088;
    server_name aram.c99-dev.com;
    root /srv/aram-random-pick/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { try_files $uri $uri/ =404; }
}
