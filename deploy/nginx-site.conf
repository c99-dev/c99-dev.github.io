server {
    listen 80;
    listen [::]:80;
    server_name aram.c99-dev.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://aram.c99-dev.com$request_uri; }
}

server {
    # Tailscale Serve와 충돌하지 않도록 OCI NIC에만 HTTPS를 바인딩합니다.
    listen 10.0.0.114:443 ssl;
    listen 127.0.0.1:8088;
    server_name aram.c99-dev.com;
    ssl_certificate /etc/letsencrypt/live/aram.c99-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aram.c99-dev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/aram-random-pick/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    location / { try_files $uri $uri/ =404; }
    location ~ ^/static/.+-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
}
