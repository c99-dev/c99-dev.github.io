  <rect width="1200" height="630" fill="#282c34"/>
  <rect x="64" y="70" width="6" height="62" rx="3" fill="#61dafb"/>
  <g font-family="Arial, Malgun Gothic, sans-serif">
    <text x="94" y="110" fill="#9bb0c4" font-size="24" letter-spacing="3">LEAGUE OF LEGENDS · ARAM</text>
    <text x="64" y="219" fill="#ffffff" font-size="64" font-weight="700">칼바람 랜덤 픽</text>
    <text x="68" y="282" fill="#d5dbe3" font-size="29">블루 팀과 레드 팀, 챔피언 선택을 간편하게</text>
    <rect x="64" y="333" width="506" height="120" rx="18" fill="#303644" stroke="#4d64ed" stroke-width="2"/>
    <rect x="598" y="333" width="538" height="120" rx="18" fill="#35323b" stroke="#ed5563" stroke-width="2"/>
